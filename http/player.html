<!DOCTYPE html>
<html>

<body>
    <div id="player"></div>
    <script>
        "use strict";
        function loadVideo(videoId) {
            console.log("DEBUG: LOAD VIDEO");
            if (player.loadVideoById !== undefined) {
                player.loadVideoById(videoId, 0, 'small');
            }
        }
        function playVideo() {
            console.log("DEBUG: PLAY");
            if (player.playVideo !== undefined) {
                player.playVideo();
            }
        }
        function cueVideo(videoId, startPosition) {
            console.log("DEBUG: CUE");
            if (player.cueVideoById !== undefined) {
                player.cueVideoById(videoId, startPosition);
            }
        }
        function pauseVideo() {
            player.pauseVideo();
        }
        function seekTo(position) {
            player.seekTo(position, true);
        }
        function setVolume(volume) {
            player.setVolume(volume);
        }
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        var player;
        var ws = new WebSocket('ws://localhost:8765');

        function sendEvent(event, data) {
            if (ws.readyState == ws.OPEN) {
                ws.send(`{"event": "${event}", "data": "${data}"}`);
            }
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                },
                autoplay: false
            });
        }
        function onPlayerReady(event) {
            // I have found it to be more pleasant for the initial 
            // volume to be right about the middle of the maximum.
            let initialVolume = 50;
            player.setVolume(initialVolume);
            sendEvent('playerVolumeChanged', initialVolume);
            
            setInterval(function () {
                let position = player.getCurrentTime();
                if (position !== undefined) {
                    sendEvent('playerProgressChanged', position);
                }
            }, 1000);
            sendEvent('playerReady', '');
        }
        function onPlayerStateChange(event) {
            console.log(`Player status change: ${event.data}.`);
            sendEvent('playerStateChanged', event.data);
        }
    </script>
</body>

</html>
